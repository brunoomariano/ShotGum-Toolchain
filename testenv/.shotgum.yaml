version: "1"

categories:
  - name: dev
    description: Local project development tools
    scripts_path: ./scripts
    help_flag: --help

scripts:
  - name: build
    category: dev
    description: Build the project binary
    type: script
    path: build.sh

  - name: test
    category: dev
    description: Run the test suite
    type: script
    path: test.sh

  - name: lint
    category: dev
    description: Run linter and format checks
    type: script
    path: lint.sh

  - name: clean
    category: dev
    description: Remove build artifacts and cache
    type: script
    path: clean.sh

  - name: deploy
    category: dev
    description: Deploy to staging environment
    type: script
    path: deploy.sh

  - name: logs
    category: dev
    description: Tail recent application logs
    type: script
    path: logs.sh

  - name: env
    category: dev
    description: Print current environment variables
    type: script
    path: env.sh
    help_flag: --show-me

  - name: status
    category: dev
    description: Check service health and status
    type: script
    path: status.sh
    help_flag: --show-me
